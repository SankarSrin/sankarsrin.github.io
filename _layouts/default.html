<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% capture page_title %}{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.headline }}{% endif %}{% endcapture %}
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta name="author" content="{{ site.title }}">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ site.description | strip_newlines | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/portrait.png' | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.title }}",
    "jobTitle": "{{ site.headline }}",
    "email": "mailto:{{ site.email }}",
    "url": "{{ site.url }}",
    "image": "{{ '/assets/img/portrait.png' | absolute_url }}",
    "sameAs": [
      "https://github.com/{{ site.github }}",
      "https://www.linkedin.com/in/{{ site.linkedin }}/",
      "https://scholar.google.com/citations?user={{ site.scholar }}",
      "https://www.researchgate.net/profile/{{ site.researchgate }}"
    ]
  }
  </script>
</head>
<body>
  {% include nav.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
